---
apiVersion: mongodb.com/v1
kind: MongoDBOpsManager
metadata:
  name: ops-manager
  namespace: mongodb
spec:
  replicas: 1
  version: 8.0.7
  adminCredentials: ops-manager-credentials-secret
  applicationDatabase:
    members: 3
    version: 8.0.7
    agent:
      mongod:
        logRotate:
          sizeThresholdMB: "500"
          timeThresholdHrs: 24
          numUncompressed: 1
          numTotal: 5
    podSpec:
      persistence:
        single:
          storage: 30Gi
          storageClass: ssd-perf-xfs-r1
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: beta.kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
  statefulSet:
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: beta.kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
  externalConnectivity:
    type: ClusterIP
    port: 8080
  backup:
    enabled: true
    headDB:
      storage: 30Gi
      storageClass: ssd-perf-r3
    opLogStores:
      - name: oplog-store
        mongodbResourceRef:
          name: oplog
        mongodbUserRef:
          name: oplog-mongodb-user
    s3Stores:
      - name: s3-store
        s3SecretRef:
          name: s3-user-ops-manager-backup
        s3BucketEndpoint: http://minio.minio.svc.cluster.local:9000
        s3BucketName: ops-manager-backup
        s3RegionOverride: us-east-1
        pathStyleAccessEnabled: true
