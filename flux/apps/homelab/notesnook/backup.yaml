---
apiVersion: s3.onyxia.sh/v1alpha1
kind: Bucket
metadata:
  labels:
    app.kubernetes.io/name: bucket
    app.kubernetes.io/instance: bucket-notesnook-backup
    app.kubernetes.io/part-of: s3-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: s3-operator
  name: minio-bucket-notesnook-backup
spec:
  name: notesnook-backup
  quota:
    # 10GB
    default: 10000000000
  s3InstanceRef: minio/s3-cluster-instance
---
apiVersion: s3.onyxia.sh/v1alpha1
kind: Policy
metadata:
  labels:
    app.kubernetes.io/name: policy
    app.kubernetes.io/instance: policy-notesnook-backup
    app.kubernetes.io/part-of: s3-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: s3-operator
  name: minio-policy-notesnook-backup
spec:
  name: notesnook-backup
  s3InstanceRef: minio/s3-cluster-instance
  policyContent: >-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
              "s3:AbortMultipartUpload",
              "s3:DeleteObject",
              "s3:GetObject",
              "s3:ListMultipartUploadParts",
              "s3:PutObject"
          ],
          "Resource": [
              "arn:aws:s3:::notesnook-backup/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
              "s3:GetBucketLocation",
              "s3:ListBucket",
              "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
              "arn:aws:s3:::notesnook-backup"
          ]
        }
      ]
    }
---
apiVersion: s3.onyxia.sh/v1alpha1
kind: S3User
metadata:
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/instance: user-notesnook-backup
    app.kubernetes.io/part-of: s3-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: s3-operator
  name: s3-user-notesnook-backup
spec:
  accessKey: s3-notesnook-backup
  s3InstanceRef: minio/s3-cluster-instance
  policies:
    - notesnook-backup
---
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: notesnook-backup-mongodb-user
spec:
  username: "notesnook-backup"
  passwordSecretKeyRef:
    name: notesnook-backup-mongodb-secret
    key: password
  db: "admin"
  mongodbResourceRef:
    name: nn
  connectionStringSecretName: notesnook-backup-mongodb-connection-string
  roles:
    - db: "admin"
      name: "backup"
---
# Daily mongodump of the nn replica set to the notesnook-backup bucket on
# versitygw on truenas-01.
# Dumps older than 14 days are removed after each successful upload.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nn-mongodump
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: mongodump
              image: docker.io/library/mongo:7.0.21
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -ec
                - |
                  mongodump --uri="$MONGODB_URI" --sslCAFile=/ca/ca-pem \
                    --oplog --gzip --archive="/work/nn-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: notesnook-backup-mongodb-connection-string
                      key: connectionString.standard
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: ca
                  mountPath: /ca
                  readOnly: true
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.42.5
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -ec
                - |
                  s3() { aws --endpoint-url http://192.168.95.15:9000 "$@"; }
                  for f in /work/nn-*.archive.gz; do s3 s3 cp "$f" "s3://notesnook-backup/$(basename "$f")"; done
                  cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%S)
                  for key in $(s3 s3api list-objects-v2 --bucket notesnook-backup \
                      --query "Contents[?LastModified<'${cutoff}'].Key" --output text); do
                    [ "$key" = None ] || s3 s3 rm "s3://notesnook-backup/$key"
                  done
                  s3 s3 ls s3://notesnook-backup/
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: notesnook-backup-s3-secret
                      key: accessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: notesnook-backup-s3-secret
                      key: secretKey
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 5Gi
            - name: ca
              configMap:
                name: notesnook-db-ca
